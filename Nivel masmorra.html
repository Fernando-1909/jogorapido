<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuga da Masmorra</title>
<style>
:root{color-scheme:dark;--bg:#0d0b12;--fg:#efe8d8;--muted:#9a90ad;--line:#2b2438;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;touch-action:manipulation;user-select:none}
canvas{width:min(100%,960px);height:auto;aspect-ratio:8/5;border:2px solid var(--line);border-radius:8px;image-rendering:pixelated;background:#000}
#pad{display:none;gap:12px}
#pad button{width:76px;height:60px;font-size:26px;border-radius:12px;border:2px solid var(--line);background:#1d1728;color:var(--fg)}
#pad button:active{background:#3a2d52}
@media(pointer:coarse){#pad{display:flex}}
small{color:var(--muted)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pad"><button data-k="l">◀</button><button data-k="r">▶</button><button data-k="j">⤒</button><button data-k="d">Z</button></div>
<small>← → / A D mover · ↑ / W / ESPAÇO pular (2x) · Z dash · ENTER reinicia</small>
<script>
"use strict";
/* ============ CONFIGURAÇÃO (ajuste aqui o balanceamento) ============ */
const CFG={
  tile:32,w:800,h:500,
  gravity:1800,maxFall:900,run:230,accel:2600,jump:700,
  time:60,coinPts:100,timeBonus:10,
  // As ameaças começam visíveis e avançam desde o início da partida.
  // A lava leva 70 segundos para atravessar a torre.
  lava:{minCol:170,maxCol:220,startRow:218,duration:70},
  // Parede maior para ficar bem visível no corredor.
  wall:{spawnCol:211,exitCol:1,row:208,rows:12,w:80}
};
const T=CFG.tile,COLS=220,ROWS=220;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=CFG.w;cv.height=CFG.h;

/* ============ SPRITES: troque os desenhos por imagens depois ============
   Para usar imagem própria:  loadSprite('player','assets/player.png');
   Sem imagem, o jogo usa o desenho padrão (fb) feito com formas/emoji.   */
const Sprites={};
function defSprite(n,fb){Sprites[n]={img:null,fb}}
function loadSprite(n,src){const i=new Image();i.onload=()=>{Sprites[n].img=i};i.src=src}
function drawSprite(n,x,y,w,h,e){const s=Sprites[n];s.img?ctx.drawImage(s.img,x,y,w,h):s.fb(x,y,w,h,e)}
// Sprite sheet do mago (5 quadros de 16x17), incorporado ao próprio HTML.
const playerSheet=new Image();
playerSheet.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFAAAAARCAYAAABKFStkAAAB8klEQVRYheWXP0jDQBTGvyt26tR2sI4ugoPUpeIShw7OpSA4i7RgR6UVQQfdimsHOzgLQnEu2KWLNO6KKIKLgtK6OHWIvOjFS3JJc420Qz44er13v3sv7z3yB/BRGZcGDb89UeeZH/yKO3M+h0WcYcNzb5T5mAz86MGCSTSntSDVLEeMt7LKjRw87x3ZNm6tHFvVIDkrUo4oz2TwKDkPKUeYd3VgUHlVMKq8Tf1u09jpLBv0K8699hs3CzabjPXjnRqX53HIWJoH9a/CM+6YrT5YGfUKNqWVmDRo7RnozoOfocKH9W+LY/0NaGcwGO5BlRfjUPEf4wlwdhHp/enWHH5idOFC8lT5sP5tcbQztjhUeF4AMY5A189hZwKcVRhVfTZFXnbOpPgZr8MK2jVU1O82DdGJKh/W/7R4K4E844fa0PyfLaZR3N9E6wrA/QWWWmum/aQbl1YjpZXMe8e4fFj/JLr3VTA0JslbXyK0SKOBimUkuFj4cyDaZEqF4P/DfzJ+iknzrk+5Chqej3s/W1R5VwJ5+5Io+2YLC2tBbsbZCPGuh0gi/wUgDX2gQ6/t/q7qyCVzP7aOv/PECL6KulHvVNm0+LDxO3lbB1bzdbNFHz9fkGSztkFr4h5RzPEK4sd7nRGWp7XawXYgXibxTBX+GykolB3/+5KiAAAAAElFTkSuQmCC';
const PLAYER_ANIMS={
  idle:{frames:[0],duration:300},
  left:{frames:[1,2],duration:300},
  right:{frames:[3,4],duration:300}
};
function drawPlayer(x,y,w,h,player){
  if(!playerSheet.complete||!playerSheet.naturalWidth){
    drawSprite('player',x,y,w,h,player);
    return;
  }
  const anim=PLAYER_ANIMS[player.animState||'idle'];
  const frame=anim.frames[player.animFrame||0];
  // Desenha o personagem em escala 2x, mantendo a caixa física original.
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(playerSheet,frame*16,0,16,17,x-6,y-5,32,34);
}

defSprite('wall',(x,y,w,h,e)=>{
  ctx.fillStyle='#352d44';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#241e30';ctx.fillRect(x,y+15,w,2);ctx.fillRect(x+16,y,2,16);ctx.fillRect(x+8,y+16,2,16);
  if(e&&e.top){ctx.fillStyle='#5a4d72';ctx.fillRect(x,y,w,3)}
});
defSprite('spike',(x,y,w,h)=>{
  ctx.fillStyle='#d9dde8';
  for(let i=0;i<2;i++){ctx.beginPath();ctx.moveTo(x+i*16,y+h);ctx.lineTo(x+i*16+8,y+8);ctx.lineTo(x+i*16+16,y+h);ctx.fill()}
});
defSprite('exit',(x,y,w,h)=>{ctx.font=Math.round(h*.8)+'px serif';ctx.fillText('🚪',x,y+h*.82)});
defSprite('coin',(x,y,w,h)=>{
  ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(x+w/2,y+h/2,w/2,0,7);ctx.fill();
  ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(x+w/2-3,y+h/2-3,3,0,7);ctx.fill();
});
defSprite('player',(x,y,w,h,e)=>{
  ctx.fillStyle='#f2c14e';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#fff';const ex=e.face>0?x+w-9:x+3;ctx.fillRect(ex,y+6,6,6);
  ctx.fillStyle='#111';ctx.fillRect(ex+(e.face>0?2:1),y+8,3,3);
});
defSprite('trap',(x,y,w,h)=>{
  ctx.fillStyle='#7a1f2b';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#d9dde8';
  for(let i=0;i<h;i+=16){ctx.beginPath();ctx.moveTo(x,y+i);ctx.lineTo(x-14,y+i+8);ctx.lineTo(x,y+i+16);ctx.fill()}
});

/* ============ FASE (monte novas fases com set/…) ============ */
let map,coins;
function buildLevel(){
  map=Array.from({length:ROWS},()=>Array(COLS).fill('.'));
  const set=(c,r,w,h,ch)=>{for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)if(x>=0&&x<COLS&&y>=0&&y<ROWS)map[y][x]=ch};
  // Ponto de bifurcação: a partir daqui o jogador escolhe uma das duas rotas.
  // ROTA 1 — corredor longo, da direita para a esquerda.
  // Os intervalos sem plataforma permanecem como abismos.
  // Segmentos de chão com vãos progressivamente maiores e plataformas de larguras variadas.
  const corridor=[
    [1,6],[14,4],[25,5],[38,4],[50,6],[64,4],[76,5],[89,4],
    [101,5],[114,4],[127,5],[140,4],[153,5],[166,4],[179,5],
    [192,4],[205,8]
  ];
  for(const [x,w] of corridor)set(x,216,w,4,'#');
  // Espinhos em zonas que pedem salto duplo, aterrissagem curta e dash.
  [[5,2],[17,1],[28,2],[41,1],[55,2],[67,1],[80,2],[92,1],[104,2],
   [117,1],[130,2],[143,1],[156,2],[169,1],[182,2],[194,1],[210,2]]
    .forEach(([x,w])=>set(x,215,w,1,'^'));
  // Plataformas suspensas opcionais/alternativas e obstáculos de teto.
  [[15,211,4],[35,209,5],[57,212,4],[78,210,5],[99,208,4],[120,211,5],
   [141,209,4],[162,211,5],[183,208,4],[201,211,4]].forEach(([x,y,w])=>set(x,y,w,1,'#'));
  [[25,208,3,1],[48,207,4,1],[88,207,3,1],[110,208,3,1],
   [151,207,4,1],[173,207,3,1]].forEach(([x,y,w,h])=>set(x,y,w,h,'#'));
  set(0,214,2,2,'E'); // saída do corredor

  // ROTA 2 — torre vertical longa, de baixo para cima.
  // Cada plataforma alterna de lado; os tamanhos mudam e os intervalos exigem
  // combinar pulo duplo com dash para corrigir a trajetória.
  const tower=[
    [198,212,9],[207,208,5],[197,204,5],[205,200,6],[194,196,5],
    [202,192,5],[211,188,5],[200,184,6],[190,180,5],[199,176,5],
    [208,172,5],[198,168,6],[188,164,5],[197,160,5],[207,156,5],
    [196,152,6],[186,148,5],[195,144,5],[205,140,5],[194,136,6],
    [184,132,5],[193,128,5],[203,124,5],[192,120,6],[182,116,5],
    [191,112,5],[201,108,5],[190,104,6],[180,100,5],[189,96,5],
    [199,92,5],[188,88,6],[178,84,5],[187,80,5],[197,76,5],
    [186,72,6],[176,68,5],[185,64,5],[195,60,5],[184,56,6],
    [174,52,5],[183,48,5],[193,44,5],[182,40,6],[172,36,5],
    [181,32,5],[191,28,5],[180,24,6],[190,20,5],[200,16,6],
    [194,11,12],[198,6,8]
  ];
  for(const [x,y,w] of tower)set(x,y,w,1,'#');
  // Alguns patamares têm espinhos; o jogador precisa aterrissar em segurança.
  [[205,207],[195,199],[210,187],[190,179],[205,155],[185,131],
   [200,107],[180,99],[195,75],[175,51],[190,23]].forEach(([x,y])=>set(x,y,2,1,'^'));
  // Blocos laterais criam pequenas passagens e obrigam a usar o dash no ar.
  [[190,202,2,3],[213,192,2,3],[188,172,2,3],[211,160,2,3],
   [184,140,2,3],[210,124,2,3],[176,108,2,3],[205,92,2,3],
   [172,76,2,3],[204,60,2,3],[170,44,2,3],[207,30,2,3]].forEach(([x,y,w,h])=>set(x,y,w,h,'#'));
  set(199,3,1,3,'E'); // saída no topo da torre

  // Cristais distribuídos pelas duas rotas, incluindo plataformas mais arriscadas.
  const positions=[
    [5,213],[17,210],[31,213],[45,213],[58,210],[72,213],[86,213],[100,210],
    [114,213],[128,213],[142,210],[156,213],[170,213],[184,210],[198,213],[211,213],
    [202,209],[199,201],[208,197],[197,193],[214,189],[201,185],[192,181],
    [201,177],[210,173],[199,169],[190,165],[199,161],[209,157],[198,153],
    [188,149],[197,145],[207,141],[196,137],[186,133],[195,129],[205,125],
    [194,121],[184,117],[193,113],[203,109],[192,105],[182,101],[191,97],
    [201,93],[190,89],[180,85],[189,81],[199,77],[188,73],[178,69],
    [187,65],[197,61],[186,57],[176,53],[185,49],[195,45],[184,41],
    [174,37],[183,33],[193,29],[182,25],[192,21],[202,17],[199,8]
  ];
  coins=positions.map(([c,r])=>({x:c*T+16,y:r*T+5,got:false}));
}
const cell=(c,r)=>(c<0||r<0||c>=COLS||r>=ROWS)?'#':map[r][c];
const overlap=(ax,ay,aw,ah,bx,by,bw,bh)=>ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;

/* ============ ESTADO ============ */
let state='menu',p,t,timeLeft,score,wall,lavaY,lavaElapsed=0,coyote,buf,endAt=0,reason='',route='',chosenRoute='',best=0,bonus=0;
try{best=+localStorage.getItem('masmorra_best')||0}catch(e){}
function reset(){
  buildLevel();
  // Começa apoiado na plataforma inicial da torre, sem queda ou derrota instantânea.
  p={x:202*T,y:212*T-28,w:20,h:28,vx:0,vy:0,ground:true,face:-1,jumps:0,dashTime:0,dashCooldown:0,animState:'idle',animFrame:0,animTime:0};
  t=0;timeLeft=CFG.time;score=0;
  wall={x:CFG.wall.spawnCol*T,v:(CFG.wall.spawnCol-CFG.wall.exitCol)*T/CFG.time};
  lavaY=CFG.lava.startRow*T;lavaElapsed=0;coyote=0;buf=0;chosenRoute='';
}
function start(){if(performance.now()-endAt<500)return;reset();state='play'}
function die(msg){state='lose';reason=msg;endAt=performance.now()}
function win(){
  state='win';bonus=Math.ceil(timeLeft)*CFG.timeBonus;score+=bonus;
  route=p.y<100*T?'pela torre':'pelo corredor';endAt=performance.now();
  if(score>best){best=score;try{localStorage.setItem('masmorra_best',best)}catch(e){}}
}

/* ============ ENTRADA ============ */
const keys={l:0,r:0};
function press(){
  if(state!=='play'){start();return}
  if(p.ground||coyote>0){buf=.12;return}
  if(p.jumps<2){p.vy=-CFG.jump; p.jumps++; coyote=0; buf=0}
}
function release(){if(p&&p.vy<-250)p.vy*=.45}
function dash(){
  if(state!=='play'){start();return}
  if(p.dashCooldown<=0){
    p.dashTime=.18;
    p.dashCooldown=.85;
    p.vx=p.face*650;
    p.vy*=.25;
  }
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')keys.l=1;
  else if(k==='arrowright'||k==='d')keys.r=1;
  else if(k==='arrowup'||k==='w'||k===' '){if(!e.repeat)press()}
  else if(k==='z'&&!e.repeat){dash();e.preventDefault()}
  else if((k==='enter'||k==='r')&&state!=='play')start();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')keys.l=0;
  else if(k==='arrowright'||k==='d')keys.r=0;
  else if(k==='arrowup'||k==='w'||k===' ')release();
});
cv.addEventListener('pointerdown',()=>{if(state!=='play')start()});
document.querySelectorAll('#pad button').forEach(b=>{
  const a=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(a==='j')press();else if(a==='d')dash();else keys[a]=1});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(a==='j')release();else keys[a]=0}));
});

/* ============ FÍSICA ============ */
function hit(axis){
  const c0=Math.floor(p.x/T),c1=Math.floor((p.x+p.w-.01)/T),r0=Math.floor(p.y/T),r1=Math.floor((p.y+p.h-.01)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    if(cell(c,r)!=='#')continue;
    if(axis==='x'){p.x=p.vx>0?c*T-p.w:(c+1)*T;p.vx=0}
    else if(p.vy>0){p.y=r*T-p.h;p.vy=0;p.ground=true;p.jumps=0}
    else{p.y=(r+1)*T;p.vy=0}
    return;
  }
}
function update(dt){
  t+=dt;timeLeft-=dt;
  const dir=keys.r-keys.l;if(dir)p.face=dir;
  p.dashCooldown=Math.max(0,p.dashCooldown-dt);
  p.dashTime=Math.max(0,p.dashTime-dt);
  if(p.dashTime>0){p.vx=p.face*650;p.vy*=Math.pow(.08,dt)}
  else{
    const tv=dir*CFG.run,a=CFG.accel*dt;
    p.vx=p.vx<tv?Math.min(tv,p.vx+a):Math.max(tv,p.vx-a);
  }
  coyote=p.ground?.1:coyote-dt;buf-=dt;
  if(buf>0&&coyote>0){p.vy=-CFG.jump;buf=0;coyote=0;p.jumps=1}
  p.vy=Math.min(p.vy+CFG.gravity*dt,CFG.maxFall);
  p.x+=p.vx*dt;hit('x');
  p.ground=false;p.y+=p.vy*dt;hit('y');

  // Atualiza a animação conforme a direção real do movimento.
  const nextAnim=p.vx < -20 ? 'left' : (p.vx > 20 ? 'right' : 'idle');
  if(nextAnim!==p.animState){p.animState=nextAnim;p.animFrame=0;p.animTime=0;}
  const anim=PLAYER_ANIMS[p.animState];
  p.animTime+=dt;
  if(p.animTime>=anim.duration/1000){
    p.animTime=0;
    p.animFrame=(p.animFrame+1)%anim.frames.length;
  }

  // Identifica a rota escolhida: esquerda = corredor; subida = torre.
  if(chosenRoute===''){
    if(p.x<198*T)chosenRoute='corredor';
    else if(p.y<210*T)chosenRoute='torre';
  }

  if(p.y>(CFG.wall.row+10)*T)return die('Você caiu em um dos abismos!');

  // espinhos e saída
  const c0=Math.floor(p.x/T)-1,c1=Math.floor((p.x+p.w)/T)+1,r0=Math.floor(p.y/T)-1,r1=Math.floor((p.y+p.h)/T)+1;
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    const ch=cell(c,r);
    if(ch==='^'&&overlap(p.x,p.y,p.w,p.h,c*T+4,r*T+14,T-8,T-14))return die('Espetado pelos espinhos!');
    if(ch==='E'&&overlap(p.x,p.y,p.w,p.h,c*T,r*T,T,T)){route=r<100?'pela torre':'pelo corredor';return win();}
  }
  // moedas
  for(const k of coins)if(!k.got&&Math.abs(k.x-p.x-p.w/2)<20&&Math.abs(k.y-p.y-p.h/2)<22){k.got=true;score+=CFG.coinPts}
  // As duas ameaças se movem desde o começo, para que o jogador veja os perigos.
  // A lava só pode causar dano se a rota escolhida for a torre.
  const L=CFG.lava;
  lavaElapsed+=dt;
  const lavaProgress=Math.min(lavaElapsed/L.duration,1);
  lavaY=L.startRow*T-(L.startRow*T-4*T)*lavaProgress;

  if(chosenRoute==='torre'){
    const cx=p.x+p.w/2;
    if(cx>L.minCol*T&&cx<L.maxCol*T&&p.y+p.h>lavaY)
      return die('A lava te alcançou!');
  }

  // A parede também avança desde o início, mas só ameaça quem escolheu o corredor.
  const W=CFG.wall;
  if(wall){
    wall.x-=wall.v*dt;
    if(chosenRoute==='corredor'&&
       p.x+p.w>wall.x&&p.y+p.h>W.row*T&&
       p.y<(W.row+W.rows)*T&&p.x<190*T)
      return die('Esmagado pela parede de espinhos!');
  }
  if(timeLeft<=0){timeLeft=0;die('O tempo esgotou!')}
}

/* ============ DESENHO ============ */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function panel(title,lines,color){
  ctx.fillStyle='rgba(8,6,12,.82)';ctx.fillRect(60,70,CFG.w-120,CFG.h-140);
  ctx.textAlign='center';ctx.fillStyle=color;ctx.font='bold 34px monospace';ctx.fillText(title,CFG.w/2,125);
  ctx.fillStyle='#efe8d8';ctx.font='16px monospace';
  lines.forEach((l,i)=>ctx.fillText(l,CFG.w/2,170+i*28));ctx.textAlign='left';
}
function draw(){
  ctx.fillStyle='#0e0b14';ctx.fillRect(0,0,CFG.w,CFG.h);
  const cx=clamp(p.x+p.w/2-CFG.w/2,0,COLS*T-CFG.w),cy=clamp(p.y+p.h/2-CFG.h/2,0,ROWS*T-CFG.h);
  ctx.save();ctx.translate(-Math.round(cx),-Math.round(cy));
  const c0=Math.max(0,Math.floor(cx/T)),c1=Math.min(COLS-1,Math.ceil((cx+CFG.w)/T));
  const r0=Math.max(0,Math.floor(cy/T)),r1=Math.min(ROWS-1,Math.ceil((cy+CFG.h)/T));
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    const ch=map[r][c],x=c*T,y=r*T;
    if(ch==='#'){drawSprite('wall',x,y,T,T,{top:r>0&&map[r-1][c]!=='#'});continue}
    ctx.fillStyle='#1b1626';ctx.fillRect(x,y,T,T);
    if(ch==='^')drawSprite('spike',x,y,T,T);
    else if(ch==='E'&&cell(c,r-1)!=='E')drawSprite('exit',x,y,T,T*2);
  }
  for(const k of coins)if(!k.got)drawSprite('coin',k.x-10,k.y-10+Math.sin(t*5+k.x)*2,20,20);
  if(wall)drawSprite('trap',wall.x,CFG.wall.row*T,CFG.wall.w,CFG.wall.rows*T);
  drawPlayer(p.x,p.y,p.w,p.h,p);
  // lava
  const L=CFG.lava,lx=L.minCol*T,lw=(L.maxCol-L.minCol)*T,bot=(L.startRow+8)*T;
  const g=ctx.createLinearGradient(0,lavaY,0,lavaY+260);g.addColorStop(0,'#ff8a1f');g.addColorStop(1,'#9c1c0a');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(lx,bot);ctx.lineTo(lx,lavaY);
  for(let i=0;i<=lw;i+=16)ctx.lineTo(lx+i,lavaY+Math.sin(i/12+t*4)*3);
  ctx.lineTo(lx+lw,bot);ctx.fill();
  ctx.restore();

  // HUD
  ctx.font='bold 18px monospace';ctx.fillStyle=timeLeft<8?'#ff5d5d':'#efe8d8';
  ctx.fillText('⏱ '+timeLeft.toFixed(1)+'s',14,28);
  ctx.fillStyle='#ffd166';ctx.fillText('★ '+score,14,52);
  ctx.fillText('PULO '+(2-p.jumps)+'/2',150,52);
  ctx.fillText('DASH '+(p.dashCooldown<=0?'PRONTO':'RECARGA'),290,52);
  ctx.textAlign='right';ctx.fillStyle='#9a90ad';ctx.fillText('Recorde '+best,CFG.w-14,28);ctx.textAlign='left';
  if(state==='play'&&t<3.5){
    ctx.textAlign='center';ctx.fillStyle='#ffd166';ctx.font='bold 20px monospace';
    ctx.fillText('ESCOLHA: ◀ corredor   ou   ▲ torre',CFG.w/2,CFG.h-24);ctx.textAlign='left';
  }
  if(state==='menu')panel('FUGA DA MASMORRA',[
    'O mecanismo de defesa foi ativado!','',
    '◀ CORREDOR: atravesse o percurso longo da direita para a esquerda.',
    '▲ TORRE: suba a sequência de plataformas até o topo.',
    'As duas rotas são válidas e têm desafios próprios.',
    'Pulo duplo + dash (Z) são essenciais para vencer os vãos.',
    'A lava sobe lentamente em 70 segundos; a parede avança pelo corredor em 60.',
    'Colete cristais ★ e alcance uma das portas.','',
    'ENTER, ESPAÇO ou toque para começar'],'#ffd166');
  if(state==='win')panel('VOCÊ ESCAPOU!',[
    'Saída '+route,'Pontuação: '+score+'  (bônus de tempo: +'+bonus+')','Recorde: '+best,'',
    'ENTER, ESPAÇO ou toque para jogar de novo'],'#7dffa0');
  if(state==='lose')panel('VOCÊ CAIU...',[
    reason,'Pontuação: '+score+'   Recorde: '+best,'',
    'ENTER, ESPAÇO ou toque para tentar de novo'],'#ff6b6b');
}

/* ============ LOOP ============ */
reset();
let last=performance.now();
(function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play')update(dt);
  draw();requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
